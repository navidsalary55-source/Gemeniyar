name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate launcher icons from text files
        run: |
          rm -rf app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d tools/ic_launcher.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          base64 -d tools/ic_launcher_round.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          base64 -d tools/ic_launcher_foreground.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          ls -la app/src/main/res/mipmap-xxxhdpi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-apk
          path: app/build/outputs/apk/debug/*.apk
