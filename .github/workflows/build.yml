name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate launcher icons from text files
        run: |
          rm -rf app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d tools/ic_launcher.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          base64 -d tools/ic_launcher_round.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          base64 -d tools/ic_launcher_foreground.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          ls -la app/src/main/res/mipmap-xxxhdpi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIHub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-apk
          path: AIHub.apk

      - name: Move the latest tag to this commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AIHub - latest
          body: "Latest APK build. Download AIHub.apk and install it."
          files: AIHub.apk
          make_latest: true
